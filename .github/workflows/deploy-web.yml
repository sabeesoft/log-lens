name: Deploy web app

# Builds the standalone Log Lens web app / PWA and publishes it to GitHub Pages.
# The site is static — no server, no secrets. One-time setup: in the repo,
# Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            webview-ui/package-lock.json

      # The web app consumes @sabeesoft/loglens-core from ../packages/core (file:),
      # whose exports resolve to dist/ — so the core must be built first.
      - name: Build parsing core
        run: npm ci && npm run build
        working-directory: packages/core

      - name: Install web deps
        run: npm ci
        working-directory: webview-ui

      # Fail the build if any network API sneaks into the source — the privacy
      # promise is tested in CI, not just asserted.
      - name: Privacy guard (no network)
        run: npm run check:no-network
        working-directory: webview-ui

      - name: Build web app
        run: npm run build:web
        working-directory: webview-ui

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webview-ui/build-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
